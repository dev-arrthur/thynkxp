name: ThynkXP site refresh

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/thynkxp-site-refresh.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar ajustes
        run: python3 .github/thynkxp_refresh.py

      - name: Validar
        run: |
          grep -q '5532988221108' index.html
          grep -q 'https://www.instagram.com/thynkxp/' index.html
          grep -q 'projects-marquee' index.html
          ! grep -q 'larrisamoraes.html' index.html
          ! grep -q 'velora.html' index.html
          ! grep -q 'projetos-em-breve.html' index.html

      - name: Publicar alteracoes
        run: |
          rm -f .github/workflows/thynkxp-site-refresh.yml
          rm -f .github/thynkxp_refresh.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Atualiza contatos e simplifica cases da ThynkXP'
          git push origin HEAD:main
