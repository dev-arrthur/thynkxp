name: Fix project card borders
on:
  push:
    branches: [fix/project-card-borders]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-card-borders
      - name: Padronizar cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  </style>'
          css = '''\n    /* Padronizacao visual dos cards Saboratti e PagBank Next */\n    .project-card,\n    .project-card.featured-project {\n      box-sizing: border-box;\n      border-width: 1px;\n      border-style: solid;\n    }\n\n    @media (min-width: 992px) {\n      .projects-track .project-card,\n      .projects-track .project-card.featured-project,\n      .projects-track .project-card:first-child,\n      .projects-track .project-card:nth-child(2),\n      .projects-track .project-card:nth-child(3),\n      .projects-track .project-card:nth-child(4),\n      .projects-track .project-card:nth-child(5),\n      .projects-track .project-card:nth-child(6),\n      .projects-track .project-card:nth-child(7),\n      .projects-track .project-card:nth-child(8) {\n        border-radius: 32px !important;\n        border-color: rgba(255, 106, 0, .18) !important;\n        overflow: hidden;\n      }\n    }\n'''
          if 'Padronizacao visual dos cards Saboratti e PagBank Next' not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar HTML basico
        run: |
          grep -q 'border-radius: 32px !important' index.html
          grep -q 'Padronizacao visual dos cards Saboratti e PagBank Next' index.html
      - name: Commitar ajuste e remover workflow temporario
        run: |
          rm -f .github/workflows/fix-project-card-borders.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-project-card-borders.yml
          git commit -m 'fix: uniformizar bordas dos cards de projetos'
          git push origin fix/project-card-borders
