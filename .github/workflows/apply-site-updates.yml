name: Apply ThynkXP site updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply site update
        run: python3 tools/apply_site_updates.py
      - name: Add privacy policy
        run: |
          if [ ! -f politica-privacidade.html ]; then
            printf '%s\n' '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Política de Privacidade | ThynkXP</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f3efe8;color:#171717;line-height:1.7;margin:0}.wrap{max-width:820px;margin:0 auto;padding:56px 22px}.card{background:#fff;border:1px solid #e6dfd3;border-radius:28px;padding:34px}h1{line-height:1.05}h2{margin-top:32px}a{color:#ff6a00}</style></head><body><main class="wrap"><div class="card"><h1>Política de Privacidade</h1><p>Esta página explica, de forma resumida, como a ThynkXP utiliza dados e cookies em seu site.</p><h2>Cookies</h2><p>Utilizamos cookies necessários para o funcionamento do site. Cookies opcionais de análise somente devem ser utilizados após sua autorização.</p><h2>Preferências</h2><p>Você pode aceitar ou recusar cookies opcionais no aviso exibido ao acessar o site. Suas preferências ficam armazenadas no navegador para que o aviso não seja exibido novamente a cada visita.</p><h2>Contato</h2><p>Para dúvidas sobre privacidade, entre em contato pelo e-mail <a href="mailto:thynkcontato@gmail.com">thynkcontato@gmail.com</a>.</p><p><a href="index.html">← Voltar para o site</a></p></div></main></body></html>' > politica-privacidade.html
          fi
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html politica-privacidade.html
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "feat: refresh projects and cookie consent [thynkxp-site-update]"
            git push
          fi
